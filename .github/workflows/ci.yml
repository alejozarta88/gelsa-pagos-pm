name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y probar contra PostgreSQL real (Testcontainers)
        run: mvn -B verify
      - name: Construir la imagen
        run: docker build -t pagos-pmv:ci .

  # El gate tiene que poder fallar: cada sabotaje rompe una garantía y exige que su prueba falle.
  sabotajes:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        id: [S1, S2, S3, S4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Sabotaje ${{ matrix.id }}
        run: bash scripts/sabotaje.sh ${{ matrix.id }}
