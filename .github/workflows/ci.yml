name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y probar contra PostgreSQL real (Testcontainers)
        run: mvn -B verify
      - name: Construir la imagen
        run: docker build -t pagos-pmv:ci .
